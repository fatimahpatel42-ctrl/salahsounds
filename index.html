<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salah Sounds | Mosque Sound Systems, Event AV &amp; Live Streaming</title>
<meta name="description" content="Salah Sounds designs, installs and tunes Haramain-style sound systems for mosques across the UK and worldwide. Event AV, live streaming, training and remote support.">
<meta property="og:title" content="Salah Sounds | The Haramain sound. In your masjid.">
<meta property="og:description" content="Mosque sound systems, event AV and live streaming. Rated Excellent on Google.">
<meta property="og:image" content="img/salah-sounds-logo.png">
<link rel="icon" href="img/salah-sounds-logo.png">
<script>try{var d=localStorage.getItem('ss-theme');if(d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.style.background='#0B0F1E';document.documentElement.style.colorScheme='dark'}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Archivo:wght@400;500;600;800&amp;family=Outfit:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit}a:hover{opacity:.85}
.bar{transform-origin:bottom;animation-name:eq;animation-iteration-count:infinite;animation-direction:alternate;animation-timing-function:ease-in-out}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
.marq{display:flex;gap:64px;width:max-content;animation:marq 36s linear infinite}
@keyframes marq{to{transform:translateX(-50%)}}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
input[type=range]{accent-color:#5A55D6}

@keyframes fadeUp{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes rise{from{opacity:0;translate:0 36px;scale:.98}to{opacity:1;translate:0 0;scale:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(169,180,255,.7)}100%{box-shadow:0 0 0 16px rgba(169,180,255,0)}}
@keyframes slide{to{background-position:200% 0}}
.in1,.in2,.in3,.in4,.in5{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}

@keyframes logoIn{0%{opacity:0;scale:.86;filter:blur(8px)}60%{opacity:1;scale:1.02;filter:blur(0)}100%{opacity:1;scale:1}}
@keyframes splashOut{0%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -40px;visibility:hidden}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;animation:splashOut .8s cubic-bezier(.7,0,.3,1) 2.1s forwards;pointer-events:none}
.splash img{width:min(340px,70vw);height:auto;animation:logoIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.splash .wv{display:flex;align-items:center;gap:5px;height:34px}
.splash .wv span{width:4px;height:34px;border-radius:3px;background:linear-gradient(180deg,#4F7FE0,#7A4FC0);animation:wave 1s ease-in-out infinite;transform-origin:center}
.splash .ld{width:160px;height:3px;border-radius:3px;background:#DCE0EE;overflow:hidden}
.splash .ld i{display:block;height:100%;background:linear-gradient(90deg,#4F7FE0,#7A4FC0);transform-origin:left;animation:load 1.9s ease-out .2s both}
.in1{animation-delay:2.4s}.in2{animation-delay:2.52s}.in3{animation-delay:2.64s}.in4{animation-delay:2.76s}.in5{animation-delay:2.9s}

@supports (animation-timeline: view()){
section h2,article,figure,ol>li,#work a,#estimate form,#estimate>div>div,.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 25%}
}
article,figure,#work a{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
article:hover,figure:hover,#work a:hover{transform:translateY(-6px);box-shadow:0 28px 56px rgba(30,35,80,.14)}
a[style*="border-radius: 999px"],button{transition:transform .2s ease,filter .2s ease,background-color .2s}
a[style*="border-radius: 999px"]:hover,button:hover{transform:translateY(-2px);filter:brightness(1.06)}
.playbtn{animation:ring 1.8s ease-out infinite}
.stripe{background-size:200% 100%!important;animation:slide 6s linear infinite}
#work a img{transition:transform .5s}
#work a:hover img{transform:scale(1.06) rotate(-2deg)}

.bar-short{display:none}.nav-book{display:none}
@media (max-width: 760px){
.bar-long{display:none}.bar-short{display:inline}
.hdr{padding:12px 18px!important;flex-wrap:nowrap!important;gap:10px!important}
.hdr-logo{height:40px!important}
.hdr-book{display:none!important}
.hdr-burger{display:flex!important}
#main-nav{display:none!important}
#main-nav.open{display:flex!important;position:absolute;left:12px;right:12px;top:calc(100% - 4px);flex-direction:column;gap:2px!important;background:var(--surf);border:1px solid var(--ln);border-radius:22px;padding:10px;z-index:50;box-shadow:0 24px 48px rgba(10,15,40,.18);font-size:17px!important;animation:fadeUp .25s ease both}
#main-nav.open a{padding:13px 14px;border-radius:14px}
#main-nav.open .nav-book{display:block;margin-top:6px;padding:15px 14px}
#top{padding-top:8px!important}
.sep{display:none}
.cta-fam{padding:14px 22px!important;text-align:center;justify-content:center;line-height:1.3}
}
@media (prefers-reduced-motion: reduce){.splash{display:none!important}.bar,.marq,.pulse,.playbtn,.stripe,.in1,.in2,.in3,.in4,.in5,section h2,article,figure,ol>li,#work a,.rv{animation:none!important;transition:none!important}}
</style>
</head>

</html>
